<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vault – Gian hàng 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#b8964a;--ink:#2d281d;--ease:cubic-bezier(.3,.7,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#ddd6c1;color:var(--ink);font-family:Inter,system-ui,sans-serif;user-select:none;touch-action:none}
input{user-select:text}
/* ===== Khung nhìn (sơn trắng ngà) ===== */
.view{position:absolute;inset:52px 0 34px;background:radial-gradient(ellipse at 50% 0%,#f4efdf,#e3dcc6 55%,#c7bda2);transition:opacity .7s,transform .7s}
.view.off{opacity:0;pointer-events:none}
#hall.off{transform:scale(.9)}
.scene{position:absolute;inset:0;perspective:1000px;perspective-origin:50% 45%;transform:scale(var(--k,1))}
.world{position:absolute;inset:0;transform-style:preserve-3d}
.f{position:absolute}
/* ===== Sảnh: sàn đá và các tủ kính trưng bày ===== */
.stage{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transition:transform .9s var(--ease);will-change:transform}
.stage.dive{transition:transform 1.3s cubic-bezier(.55,0,.85,.45)}
.lf{position:absolute;left:-1800px;top:-1000px;width:3600px;height:2000px;transform:translate3d(0,106px,-400px) rotateX(90deg);
 background:radial-gradient(ellipse 45% 22% at 50% 78%,rgba(255,255,255,.4),transparent),linear-gradient(#dcd4bb,#cfc5aa 45%,#e0dac7)}
.sh{position:absolute;left:-160px;top:-140px;width:320px;height:280px;transition:transform .8s var(--ease);
 background:radial-gradient(ellipse,rgba(70,55,25,.34) 0,transparent 52%),radial-gradient(ellipse,color-mix(in srgb,var(--c) 38%,transparent) 0,transparent 72%)}
.dc{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transition:transform .8s var(--ease)}
.shd{position:absolute;left:-110px;top:-110px;width:220px;height:220px;transform:translateY(-2px) rotateX(90deg);background:radial-gradient(ellipse,rgba(70,55,25,.3) 0,transparent 62%)}
.plt{position:absolute;left:-45px;top:-92px;width:90px;height:90px;font-size:80px;text-align:center;line-height:90px}
.bn{position:absolute;left:-55px;top:-44px;width:110px;height:44px;transform-style:preserve-3d}
.bn .f{background:#e6dfca;border:1px solid #c0b595}
.bn .bf{width:110px;height:44px;transform:translateZ(22px);background:linear-gradient(#a98550 0 34%,#e6dfca 34%)}
.bn .bt{top:-22px;width:110px;height:44px;transform:rotateX(90deg);background:#b8935a}
.bn .bs1,.bn .bs2{left:33px;top:0;width:44px;height:44px;background:#d6cdb3}
.bn .bs1{transform:rotateY(-90deg) translateZ(55px)}.bn .bs2{transform:rotateY(90deg) translateZ(55px)}
.pd{position:absolute;left:-1px;top:-470px;width:2px;height:290px;background:#8a7a58}
.pd::after{content:'';position:absolute;left:-23px;top:276px;width:48px;height:26px;border-radius:24px 24px 4px 4px;background:#7d6f50;box-shadow:0 18px 34px 8px rgba(255,214,130,.4)}
.sign{position:absolute;top:6%;left:0;right:0;text-align:center;pointer-events:none}
.sign b{display:block;font:600 clamp(2rem,6.5vw,4.6rem)/1.1 Cinzel,serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(125,98,48,.4);text-shadow:0 2px 0 #fff9;animation:sg .7s ease both}
.sign small{display:block;margin-top:6px;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(107,98,80,.75)}
@keyframes sg{from{opacity:0;transform:translateY(12px)}}
.ws{position:absolute;left:50%;top:46%;width:900px;margin-left:-450px;text-align:center;transform:translate3d(0,-345px,-299px);pointer-events:none;
 font:600 40px Cinzel,serif;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--cc,#c9a24b) 45%,#8a7a58);opacity:.6}
.booth{position:absolute;left:-100px;top:-100px;width:200px;height:200px;transform-style:preserve-3d;cursor:pointer;transition:transform .8s var(--ease);will-change:transform}
.booth .f{background:linear-gradient(135deg,rgba(255,255,255,.36),rgba(190,224,236,.14));border:2px solid color-mix(in srgb,var(--c) 55%,#fff)}
.booth .bk{left:0;top:0;width:200px;height:160px;transform:translateZ(-80px);background:linear-gradient(#f0ebdb,#dcd4be)}
.booth .lw,.booth .rw{top:0;width:160px;height:160px;transform:rotateY(90deg)}
.booth .lw{left:-80px}.booth .rw{left:120px}
.booth .gf{left:0;top:0;width:200px;height:160px;transform:translateZ(80px)}
.booth .rf{left:0;top:-80px;width:200px;height:160px;transform:rotateX(90deg)}
.booth .cf{left:0;top:80px;width:200px;height:160px;transform:rotateX(90deg);background:radial-gradient(circle,#f4efe0,#d5ccb3);border-color:#c4b99a;box-shadow:none}
.booth .pf{left:0;top:160px;width:200px;height:40px;transform:translateZ(80px);background:linear-gradient(#f0ebdb,#d3cab3);border:1px solid #c0b595;border-top:4px solid var(--c);box-shadow:none;
 display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3a3326;font:600 13px/1.15 Cinzel,serif;text-align:center}
.booth .pf small{font:400 10px Inter,sans-serif;color:#6b6250;margin-top:2px}
.booth .ps,.booth .pr2{top:160px;width:160px;height:40px;transform:rotateY(90deg);background:#d9d1ba;border:1px solid #c0b595;box-shadow:none}
.booth .ps{left:-80px}.booth .pr2{left:120px}
.booth .pv{left:50px;top:42px;width:100px;height:110px;display:grid;place-items:center;font-size:62px;background:none;border:0;box-shadow:none;transform:translateZ(0)}
.pv img{width:84px;height:84px;object-fit:contain}
/* ===== Hành lang (không trần) ===== */
#hall{--ln:color-mix(in srgb,var(--cc,#c9a24b) 55%,#8a7a58)}
#hall .world{transform:rotateX(-9deg) rotateY(-9deg);transform-origin:50% 46%}
.cam{position:absolute;left:50%;top:46%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.25,.8,.25,1);will-change:transform}
#pils{position:absolute;left:0;top:0;transform-style:preserve-3d}
.cam>.fl,.cam>.wl{position:absolute;left:-1500px;width:3000px}
.cam>.fl{top:-350px;height:1000px;transform:translateX(var(--q,0px)) translateZ(200px) rotateX(90deg);background:radial-gradient(ellipse 40% 25% at 50% 60%,rgba(255,255,255,.3),transparent),linear-gradient(#c9bfa4,#e0dac7)}
.cam>.wl{top:-370px;height:520px;transform:translateX(var(--q,0px)) translateZ(-300px);background:linear-gradient(transparent calc(100% - 3px),var(--ln) 0),linear-gradient(#ece6d3,#d6cdb3)}
.pil{position:absolute;top:-10px;width:120px;height:160px;transform-style:preserve-3d;cursor:pointer}
.pil .f{left:0;top:0;width:120px;height:160px}
.pil .fr{transform:translateZ(60px);background:linear-gradient(#efe9d8,#dcd3ba)}
.pil .l{transform:rotateY(-90deg) translateZ(60px);background:linear-gradient(#cfc5a8,#bdb294)}
.pil .r{transform:rotateY(90deg) translateZ(60px);background:linear-gradient(#e2dac3,#cdc3a6)}
.pil .tp{top:-60px;height:120px;transform:rotateX(90deg);background:linear-gradient(135deg,#f4efdf,#dcd3ba)}
.pil.on .tp{background:radial-gradient(circle,#fffaf0,#f2d58c 90%)}
.pl{left:15px;top:34px;width:90px;padding:6px 2px;text-align:center;transform:translateZ(61px);color:#3a3326;font:600 11px/1.15 Cinzel,serif;
 background:linear-gradient(#f7f2e3,#e6dec6);border:1px solid var(--gold);box-shadow:0 3px 8px #0003}
.pl i{display:block;margin-top:3px;font:600 10px Inter,sans-serif;font-style:normal;color:#7a5c1e}
.lamp{position:absolute;left:40px;top:-258px;width:40px;height:12px;border-radius:6px 6px 0 0;background:#7d6f50}
.sp{position:absolute;left:-10px;top:-150px;width:140px;height:140px;display:grid;place-items:center;font-size:84px;transform:translateZ(1px);
 opacity:.8;transition:transform .7s cubic-bezier(.34,1.4,.64,1),opacity .7s}
.pil.on .sp{transform:translateZ(1px) scale(1.3) translateY(-12px);opacity:1;text-shadow:0 20px 16px #0004}
.sp img{width:110px;height:110px;object-fit:contain;border-radius:10px}
.pv>div,.pil.on .sp>div{animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
.cone{position:absolute;left:-70px;top:-240px;width:260px;height:240px;transform:translateZ(-1px);pointer-events:none;
 clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);background:linear-gradient(rgba(255,214,120,.75),rgba(255,224,150,.08));opacity:0;transition:opacity .6s}
.pil.on .cone{opacity:1}
/* ===== Đầu trang, chân trang, điều khiển ===== */
.top,.ft{position:fixed;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:linear-gradient(#efe9d7,#e2dbc6);color:#6b6250}
.top{top:0;height:52px;border-bottom:1px solid #c4b99a;box-shadow:0 2px 10px #0002}
.ft{bottom:0;height:34px;border-top:1px solid #c4b99a;font-size:.68rem;white-space:nowrap;overflow:hidden}
.brand{font:600 1.15rem Cinzel,serif;letter-spacing:.2em;color:#8a6a2a}
.crumb{font-size:.76rem;text-transform:uppercase;letter-spacing:.12em}
.crumb a{color:#8a6a2a;cursor:pointer}
.tr{display:flex;gap:8px;align-items:center}
@media(max-width:640px){.crumb,.ft span:last-child{display:none}}
#info{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);z-index:20;width:min(92vw,420px);text-align:center;padding:10px 14px;background:#f7f2e4f2;border:1px solid #cbbf9f;border-radius:10px;box-shadow:0 6px 24px #0002}
#info h2{margin:0 0 4px;font:600 1.05rem Cinzel,serif;color:#7a5c1e}
#info p{margin:2px 0;font-size:.8rem;color:#4b4435}
.pr{font-weight:600;margin:6px 0}
button{font:inherit;cursor:pointer;color:#6b4f17;background:#f7f2e4;border:1px solid var(--gold);border-radius:20px;padding:7px 14px;font-size:.8rem;box-shadow:0 2px 8px #0001}
button:hover{background:var(--gold);color:#fff}
.bar{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:96vw}
.adm{display:none}body.admin .adm{display:inline-block}
body[data-v=lobby] .ho{display:none}
body.admin #adm{background:var(--gold);color:#fff}
dialog{background:#f7f2e4;color:var(--ink);border:1px solid var(--gold);border-radius:12px;padding:18px;width:min(92vw,380px)}
dialog::backdrop{background:#0006}
dialog h3{margin:0 0 6px;font:600 1rem Cinzel,serif;color:#7a5c1e}
dialog label{display:block;margin:9px 0;font-size:.75rem;color:#6b6250}
dialog input{width:100%;margin-top:3px;padding:7px;background:#fff;color:#222;border:1px solid #cbbf9f;border-radius:6px}
dialog .ac{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
</style>
</head>
<body data-v="lobby" class="admin">

<header class="top"><b class="brand">THE VAULT</b><div class="crumb" id="sub"></div>
  <div class="tr"><button id="cart">🛒 0</button><button id="adm" title="Bật/tắt chế độ quản trị">⚙ Quản trị</button></div></header>

<!-- Sảnh gian hàng -->
<section id="lobby" class="view"><div class="sign" id="sign"></div><div class="scene"><div class="stage" id="stage"></div></div></section>
<!-- Hành lang -->
<section id="hall" class="view off"><div class="scene"><div class="world">
  <div class="ws" id="ws"></div>
  <div class="cam" id="cam"><div class="fl"></div><div class="wl"></div><div id="pils"></div></div>
</div></div></section>

<div id="info"></div>
<nav class="bar">
  <button id="back" class="ho">⌂ Về sảnh</button>
  <button id="prev">‹ Trái</button><button id="next">Phải ›</button>
  <button id="add" class="adm">＋ Thêm</button><button id="edit" class="adm">✎ Sửa</button><button id="del" class="adm">🗑 Xóa</button>
</nav>
<footer class="ft"><span>© 2026 The Vault Mall · Mua sắm trực quan 3D</span><span>Hotline 1900 0000 · Mở cửa 9:00 – 22:00 mỗi ngày</span></footer>
<dialog id="dlg"></dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('vi-VN')+'đ';
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='vault3d_v1', S=260; // S = khoảng cách giữa các trụ

/* ===== Dữ liệu (lưu trong localStorage) ===== */
const P=(name,price,icon,desc)=>({id:uid(),name,price,icon,desc,img:''});
const seed=()=>[
 {id:uid(),name:'Đồng hồ & Trang sức',icon:'⌚',color:'#c9a24b',products:[P('Chrono X1',24500000,'⌚','Đồng hồ cơ vỏ vàng, dây da thủ công'),P('Nhẫn Kim Cương',38000000,'💍','Kim cương tự nhiên 1 carat'),P('Vòng Ngọc',9800000,'📿','Ngọc bích chế tác thủ công')]},
 {id:uid(),name:'Thời trang',icon:'👜',color:'#b5486a',products:[P('Aero Steppers',1200000,'👟','Giày thể thao phiên bản giới hạn'),P('Lumière Tote',4600000,'👜','Túi da bê cao cấp'),P('Áo Khoác Da',6900000,'🧥','Da thật, lót lụa'),P('Mũ Dạ',890000,'🎩','Dáng cổ điển')]},
 {id:uid(),name:'Công nghệ',icon:'🎧',color:'#3a86c8',products:[P('Sonic Pro',8500000,'🎧','Tai nghe chống ồn chủ động'),P('Phone X',21900000,'📱','Màn hình OLED 120Hz'),P('Laptop Air',32000000,'💻','Mỏng nhẹ, pin 20 giờ'),P('Camera Pro',15500000,'📷','Cảm biến full-frame')]},
 {id:uid(),name:'Nước hoa & Làm đẹp',icon:'🧴',color:'#7a4fb5',products:[P('Essence No.5',3200000,'🧴','Hương hoa cỏ tinh tế'),P('Son Lụa',650000,'💄','Lì mịn, lâu trôi'),P('Gương Pha Lê',1800000,'🪞','Viền pha lê chạm khắc')]}
];
let cats;try{cats=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(cats)||!cats.length)cats=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(cats))}catch(e){}};

let view='lobby',cur=0,ci=0,pi=0,cart=0,R=380,step=0;
const act=()=>cur;
const art=o=>o.img?`<img src="${esc(o.img)}" alt="">`:esc(o.icon);

/* ===== Sảnh ===== */
// Các gian xếp theo cung tròn lớn (quay thẳng mặt ra trước), gian được chọn nằm giữa và nâng lên
const ps=(j,y)=>{const x=(j-cur)*500;return `translate3d(${x}px,${y}px,${-x*x/2000}px)`};
const bt=i=>ps(i,i===cur?-26:0);
const BENCH='<div class="bn"><div class="f bf"></div><div class="f bt"></div><div class="f bs1"></div><div class="f bs2"></div></div>';
let lastSign='';
function drawLobby(){
  const n=cats.length;cur=Math.max(0,Math.min(cur,n-1));
  let h='<div class="lf"></div>';
  for(let i=0;i<=n;i++)h+=`<div class="dc" style="transform:${ps(i-.5,106)}"><div class="shd"></div><div class="pd"></div>${i%2?'<div class="plt">🪴</div>':BENCH}</div>`; // đèn thả + ghế/cây giữa các gian
  h+=cats.map((c,i)=>`<div class="sh" style="--c:${esc(c.color)};transform:${ps(i,104)} rotateX(90deg)"></div>`).join('');
  h+=cats.map((c,i)=>{const p=c.products[0];return `<div class="booth" data-i="${i}" style="--c:${esc(c.color)};transform:${bt(i)}">
   <div class="f bk"></div><div class="f lw"></div><div class="f rw"></div><div class="f rf"></div><div class="f cf"></div>
   <div class="f ps"></div><div class="f pr2"></div>
   <div class="f pv"><div>${p?art(p):esc(c.icon)}</div></div><div class="f gf"></div>
   <div class="f pf">${esc(c.icon)} ${esc(c.name)}<small>${c.products.length} sản phẩm</small></div></div>`}).join('');
  $('#stage').innerHTML=h;
  turnLobby();
}
function turnLobby(dive){ // dive=true: lao thẳng vào gian hàng
  const st=$('#stage');st.classList.toggle('dive',!!dive);
  st.style.transform=dive?'rotateX(0deg) translateZ(1000px)':'rotateX(-12deg) translateZ(-100px)';
  document.querySelectorAll('.booth').forEach((b,i)=>{b.style.transform=bt(i);b.classList.toggle('on',i===cur)});
  document.querySelectorAll('#stage .sh').forEach((e,i)=>e.style.transform=ps(i,104)+' rotateX(90deg)');
  document.querySelectorAll('#stage .dc').forEach((e,i)=>e.style.transform=ps(i-.5,106));
  const c=cats[cur],k=c?c.id+c.name+c.icon+c.products.length:'';
  if(k!==lastSign){lastSign=k;$('#sign').innerHTML=c?`<b>${esc(c.name)}</b><small>${esc(c.icon)} ${c.products.length} sản phẩm</small>`:''}
  info();
}

/* ===== Hành lang ===== */
function drawHall(){
  const c=cats[ci],n=c.products.length;
  $('#hall').style.setProperty('--cc',c.color);
  $('#ws').textContent=c.icon+' '+c.name;
  let d='';
  for(let i=0;i<n;i++)d+=`<div class="dc" style="left:${i*S}px;top:150px"><div class="shd"></div></div>`;           // bóng dưới trụ
  for(let i=-1;i<n;i++)d+=`<div class="dc" style="left:${(i+.5)*S}px;top:150px;transform:translateZ(-170px)"><div class="shd" style="left:-75px;top:-40px;width:150px;height:80px"></div>${BENCH}</div>`; // ghế dài phía sau
  [-S*.9,(n-1)*S+S*.9].forEach(x=>d+=`<div class="dc" style="left:${x}px;top:150px"><div class="shd" style="left:-45px;top:-45px;width:90px;height:90px"></div><div class="plt">🪴</div></div>`); // cây hai đầu
  $('#pils').innerHTML=d+c.products.map((p,i)=>`<div class="pil" data-i="${i}" style="left:${i*S-60}px"><div class="lamp"></div><div class="cone"></div>
   <div class="f fr"></div><div class="f l"></div><div class="f r"></div><div class="f tp"></div>
   <div class="f pl">${esc(p.name)}<i>${money(p.price)}</i></div>
   <div class="sp"><div>${art(p)}</div></div></div>`).join('');
  moveHall();
}
function moveHall(){
  const x=pi*S,cam=$('#cam');
  cam.style.setProperty('--q',x+'px'); // sàn/tường đi theo camera, chỉ dùng transform (mượt)
  cam.style.transform=`translate3d(${-x}px,0,0)`;
  document.querySelectorAll('.pil').forEach((e,i)=>e.classList.toggle('on',i===pi));
  info();
}

/* ===== Thông tin ===== */
function info(){
  let h='';
  if(view==='lobby'){
    const c=cats[act()];$('#sub').textContent='Sảnh chính';
    h=c?`<h2>${esc(c.icon)} ${esc(c.name)}</h2><p>${c.products.length} sản phẩm · nhấn vào gian hàng để bước vào</p>`:'<p>Chưa có gian hàng. Nhấn ＋ Thêm để tạo.</p>';
  }else{
    const c=cats[ci],p=c.products[pi];$('#sub').innerHTML=`<a id="home">Sảnh chính</a> › ${esc(c.icon)} ${esc(c.name)}`;
    h=p?`<h2>${esc(p.name)}</h2><p>${esc(p.desc||'')}</p><div class="pr">${money(p.price)}</div><button class="buy">Thêm vào giỏ</button>`:'<p>Gian hàng trống. Nhấn ＋ Thêm để thêm sản phẩm.</p>';
  }
  $('#info').innerHTML=h;
}

/* ===== Điều hướng ===== */
function show(v){
  view=v;document.body.dataset.v=v;
  $('#lobby').classList.toggle('off',v!=='lobby');$('#hall').classList.toggle('off',v!=='hall');
  v==='lobby'?drawLobby():moveHall();
}
let busy=false;
function enter(i){
  if(busy||!cats.length)return;busy=true;
  cur=i;turnLobby(true);                             // phóng to nuốt trọn tầm nhìn
  setTimeout(()=>{ci=i;pi=0;drawHall();show('hall')},950);
  setTimeout(()=>busy=false,1400);
}
function go(d){
  if(busy)return;
  if(view==='lobby'){if(cats.length){cur=Math.max(0,Math.min(cats.length-1,cur+d));turnLobby()}}
  else{const m=cats[ci].products.length;if(m){pi=Math.max(0,Math.min(m-1,pi+d));moveHall()}}
}
addEventListener('keydown',e=>{
  if($('#dlg').open)return;const k=e.key;
  if(k==='ArrowRight'||k==='d')go(1);else if(k==='ArrowLeft'||k==='a')go(-1);
  else if(k==='Enter'&&view==='lobby'&&cats.length)enter(act());
  else if(k==='Escape'&&view==='hall')show('lobby');
});
let wt=0;addEventListener('wheel',e=>{
  const t=Date.now();if(t-wt<450)return;wt=t;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(d)go(d>0?1:-1);
},{passive:true});
let sx=0,mv=false;
addEventListener('pointerdown',e=>{sx=e.clientX;mv=false});
addEventListener('pointerup',e=>{
  if(e.target.closest('dialog,.bar,#info,.tr'))return;
  const d=e.clientX-sx;if(Math.abs(d)>40){mv=true;go(d<0?1:-1)}
});
$('#lobby').addEventListener('click',e=>{if(mv)return;const b=e.target.closest('.booth');if(b)enter(+b.dataset.i)});
$('#hall').addEventListener('click',e=>{if(mv)return;const b=e.target.closest('.pil');if(b){pi=+b.dataset.i;moveHall()}});
$('#info').onclick=e=>{if(e.target.matches('.buy'))$('#cart').textContent='🛒 '+(++cart)};
$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
$('#back').onclick=()=>show('lobby');
$('#sub').onclick=e=>{if(e.target.id==='home'&&view==='hall')show('lobby')};
$('#adm').onclick=()=>document.body.classList.toggle('admin');

/* ===== Biểu mẫu thêm/sửa ===== */
function form(title,fields,vals,ok){
  const dlg=$('#dlg');
  dlg.innerHTML=`<form method="dialog"><h3>${title}</h3>`+
   fields.map(f=>`<label>${f[1]}<input name="${f[0]}" type="${f[2]||'text'}" value="${esc(vals[f[0]]??'')}" ${f[3]||''}></label>`).join('')+
   `<div class="ac"><button value="x" formnovalidate>Hủy</button><button value="ok">Lưu</button></div></form>`;
  dlg.returnValue='';
  dlg.onclose=()=>{if(dlg.returnValue==='ok')ok(Object.fromEntries(new FormData(dlg.querySelector('form'))))};
  dlg.showModal();
}
const shrink=f=>new Promise(r=>{ // thu nhỏ ảnh tải lên để lưu gọn
  const im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/webp',.85))};
  im.src=URL.createObjectURL(f);
});
function catForm(c){
  const isNew=!c;c=c||{name:'',icon:'🛍️',color:'#c9a24b'};
  form(isNew?'Thêm gian hàng':'Sửa gian hàng',[['name','Tên gian hàng','text','required'],['icon','Biểu tượng (emoji)'],['color','Màu chủ đạo','color']],c,d=>{
    if(isNew){cats.push({id:uid(),products:[],...d});cur=cats.length-1}else Object.assign(c,d);
    save();drawLobby();
  });
}
function prodForm(p){
  const isNew=!p,c=cats[ci];p=p||{name:'',price:0,icon:'📦',desc:'',img:''};
  const has=(p.img||'').startsWith('data:');
  form(isNew?'Thêm sản phẩm':'Sửa sản phẩm',[['name','Tên sản phẩm','text','required'],['price','Giá (đồng)','number','min="0"'],['icon','Biểu tượng (emoji)'],['desc','Mô tả ngắn'],['url','Link ảnh (tùy chọn)','url'],['file','Hoặc tải ảnh lên','file','accept="image/*"']],
   {...p,url:has?'':p.img},async d=>{
    let img=d.url.trim();
    if(d.file&&d.file.size)img=await shrink(d.file);else if(!img&&has)img=p.img;
    const v={name:d.name,price:+d.price||0,icon:d.icon||'📦',desc:d.desc,img};
    if(isNew){c.products.push({id:uid(),...v});pi=c.products.length-1}else Object.assign(p,v);
    save();drawHall();
  });
}
$('#add').onclick=()=>view==='lobby'?catForm():prodForm();
$('#edit').onclick=()=>{
  if(view==='lobby'){if(cats.length)catForm(cats[act()])}
  else{const p=cats[ci].products[pi];if(p)prodForm(p)}
};
$('#del').onclick=()=>{
  if(view==='lobby'){
    const i=act(),c=cats[i];
    if(c&&confirm(`Xóa gian hàng "${c.name}" cùng toàn bộ sản phẩm?`)){cats.splice(i,1);save();drawLobby()}
  }else{
    const l=cats[ci].products,p=l[pi];
    if(p&&confirm(`Xóa sản phẩm "${p.name}"?`)){l.splice(pi,1);pi=Math.max(0,Math.min(pi,l.length-1));save();drawHall()}
  }
};

/* ===== Khởi động ===== */
const fit=()=>document.documentElement.style.setProperty('--k',Math.max(.5,Math.min(1,(innerHeight-86)/760,innerWidth/820)));
addEventListener('resize',fit);fit();
drawLobby();
</script>
</body>
</html>
