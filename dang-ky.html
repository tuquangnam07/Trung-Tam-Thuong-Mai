<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký – The Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth">
  <a class="brand" href="index.html">THE VAULT</a>
  <div class="card">
    <h1 id="ttl">Tạo tài khoản</h1>
    <p class="sub" id="sub">Điền đầy đủ thông tin để bắt đầu mua sắm.</p>
    <div id="msg" class="msg" role="alert" hidden></div>
    <form id="f" novalidate>
      <div id="flds"></div>
      <label class="chk" id="showrow"><input type="checkbox" id="show"> Hiện mật khẩu</label>
      <label class="chk"><input type="checkbox" id="terms"> Tôi đồng ý với điều khoản mua sắm của The Vault.</label>
      <button class="btn" id="go">Tạo tài khoản</button>
    </form>
    <div id="alt">
      <div class="or">hoặc</div>
      <button class="gbtn" id="g" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg> Đăng ký bằng Google</button>
    </div>
    <p class="foot" id="login">Đã có tài khoản? <a href="dang-nhap.html">Đăng nhập</a></p>
    <p class="foot" id="outp" hidden><button class="lnk" id="out" type="button">Dùng tài khoản khác</button></p>
  </div>
</main>
<script type="module">
import {auth,onAuthStateChanged,registerUser,saveProfile,googleSignIn,hasProfile,usernameFree,signOut,viError,nextUrl} from './js/firebase.js';
const $=s=>document.querySelector(s), go=()=>{location.href=nextUrl()};
const F=[
 ['fullName','Họ và tên đầy đủ','text','name','Ví dụ: Nguyễn Văn An'],
 ['username','Tên đăng nhập','text','username','4–20 ký tự: chữ thường không dấu, số hoặc dấu gạch dưới'],
 ['email','Email','email','email',''],
 ['phone','Số điện thoại','tel','tel','Ví dụ: 0912 345 678'],
 ['password','Mật khẩu','password','new-password','Ít nhất 8 ký tự, gồm cả chữ và số'],
 ['confirm','Nhập lại mật khẩu','password','new-password','']
];
$('#flds').innerHTML=F.map(([k,l,t,a,h])=>`<div class="fld" id="w-${k}"><label for="${k}">${l}</label><input id="${k}" name="${k}" type="${t}" autocomplete="${a}" aria-describedby="e-${k}">${h?`<small class="hint">${h}</small>`:''}<small class="err" id="e-${k}"></small></div>`).join('');
const val=k=>$('#'+k).value;
const phone=v=>v.replace(/[\s.-]/g,'').replace(/^\+84/,'0');
const V={
 fullName:v=>v.trim().split(/\s+/).filter(Boolean).length>=2?'':'Vui lòng nhập đầy đủ họ và tên (ít nhất 2 từ).',
 username:v=>/^[a-z0-9_]{4,20}$/.test(v)?'':'Tên đăng nhập gồm 4–20 ký tự: chữ thường không dấu, số hoặc dấu gạch dưới.',
 email:v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())?'':'Email không hợp lệ.',
 phone:v=>/^0[35789]\d{8}$/.test(phone(v))?'':'Số điện thoại Việt Nam không hợp lệ (10 số, bắt đầu bằng 0).',
 password:v=>v.length>=8&&/[A-Za-z]/.test(v)&&/\d/.test(v)?'':'Mật khẩu cần ít nhất 8 ký tự, gồm cả chữ và số.',
 confirm:(v,g)=>v&&v===g('password')?'':'Mật khẩu nhập lại không khớp.'
};
let mode='new';
const active=()=>F.map(f=>f[0]).filter(k=>mode==='new'||!['password','confirm'].includes(k));
async function check(k){
  let m=V[k](val(k),val);
  if(!m&&k==='username'){let free=true;try{free=await usernameFree(val(k))}catch{}if(!free)m='Tên đăng nhập đã được dùng. Hãy chọn tên khác.'}
  $('#e-'+k).textContent=m;$('#'+k).setAttribute('aria-invalid',!!m);return !m;
}
F.forEach(([k])=>$('#'+k).addEventListener('blur',()=>val(k)&&check(k)));
$('#username').addEventListener('input',e=>e.target.value=e.target.value.toLowerCase().replace(/\s/g,''));
$('#password').addEventListener('input',()=>val('confirm')&&check('confirm'));
$('#show').onchange=e=>['password','confirm'].forEach(k=>$('#'+k).type=e.target.checked?'text':'password');

const msg=(t,c='bad')=>{const m=$('#msg');m.hidden=!t;m.textContent=t||'';m.className='msg '+c};
const busy=b=>{$('#go').disabled=$('#g').disabled=b;$('#go').textContent=b?'Đang xử lý…':mode==='new'?'Tạo tài khoản':'Hoàn tất hồ sơ'};
function complete(u){ // đăng nhập Google lần đầu: cần bổ sung thông tin còn thiếu
  mode='complete';
  $('#ttl').textContent='Hoàn tất hồ sơ';$('#sub').textContent='Tài khoản Google của bạn cần thêm vài thông tin trước khi mua sắm.';
  $('#email').value=u.email||'';$('#email').readOnly=true;$('#fullName').value=u.displayName||'';
  ['w-password','w-confirm','showrow','alt','login'].forEach(i=>$('#'+i).hidden=true);$('#outp').hidden=false;busy(false);
}
$('#out').onclick=async()=>{await signOut(auth);location.reload()};

$('#f').onsubmit=async e=>{
  e.preventDefault();msg();
  const ok=await Promise.all(active().map(check));
  if(ok.includes(false)){document.querySelector('[aria-invalid=true]')?.focus();return}
  if(!$('#terms').checked){msg('Bạn cần đồng ý với điều khoản để tiếp tục.');return}
  busy(true);
  const d={fullName:val('fullName').trim().replace(/\s+/g,' '),username:val('username'),email:val('email').trim().toLowerCase(),phone:phone(val('phone')),password:val('password')};
  try{mode==='new'?await registerUser(d):await saveProfile(auth.currentUser,d);go()}
  catch(err){msg(viError(err));busy(false)}
};
$('#g').onclick=async()=>{
  msg();busy(true);
  try{const {user,profile}=await googleSignIn();if(profile)return go();complete(user)}
  catch(err){msg(viError(err))}
  busy(false);
};
// Đã đăng nhập sẵn? Chuyển đi, hoặc yêu cầu bổ sung hồ sơ còn thiếu
const u0=await new Promise(r=>{const off=onAuthStateChanged(auth,u=>{off();r(u)})});
if(u0){try{(await hasProfile(u0.uid))?go():complete(u0)}catch{}}
</script>
</body>
</html>
